<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאסטר האק"ג - גרסת הפרמדיק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; font-family: system-ui, sans-serif; color: white; }
        .monitor-wrap { background: #000; border: 4px solid #334155; border-radius: 1rem; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .strip-img { width: 100%; max-height: 350px; object-fit: contain; background: white; }
        .option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; color: white; }
        .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: #3b82f6; }
        .correct { background: #16a34a !important; border-color: #22c55e !important; color: white !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; color: white !important; }
        #loading-bar-fill { width: 0%; transition: width 0.3s ease; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto">
        <div id="upload-card" class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 mt-10">
            <i class="fas fa-file-word text-6xl text-blue-400 mb-4"></i>
            <h1 class="text-3xl font-black mb-2">סימולטור אק"ג</h1>
            <p class="text-slate-400 mb-8">העלה קובץ Word עם הסטריפים והפענוחים</p>
            
            <input type="file" id="docx-file" accept=".docx" class="hidden" onchange="processDocx(event)">
            <button onclick="document.getElementById('docx-file').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-bold text-xl shadow-lg transition-all">
                בחר קובץ DOCX
            </button>

            <div id="loading-area" class="hidden mt-8 space-y-4">
                <div class="flex justify-between text-sm font-bold">
                    <span>מעבד נתונים...</span>
                    <span id="load-pct">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3">
                    <div id="loading-bar-fill" class="bg-blue-500 h-3 rounded-full"></div>
                </div>
            </div>
        </div>

        <div id="game-card" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <div class="flex gap-2">
                    <button id="prev-btn" onclick="loadPreviousQuestion()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-bold disabled:opacity-30 disabled:cursor-not-allowed">
                        <i class="fas fa-arrow-right ml-1"></i> חזור
                    </button>
                    <button id="skip-btn" onclick="skipQuestion()" class="bg-amber-600 hover:bg-amber-700 px-4 py-2 rounded-lg font-bold">
                        דלג <i class="fas fa-forward mr-1"></i>
                    </button>
                </div>
                <div id="progress-text" class="text-blue-400 font-black"></div>
                <div class="font-bold">דיוק: <span id="score" class="text-green-400">0%</span></div>
            </div>

            <div class="monitor-wrap">
                <div id="ecg-container"></div>
            </div>

            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

            <div id="feedback-panel" class="hidden bg-slate-800 p-6 rounded-2xl border-2 border-blue-500 shadow-2xl">
                <h2 id="feedback-title" class="text-2xl font-black mb-2"></h2>
                <div id="clinical-info" class="bg-slate-900 p-4 rounded-xl mb-4 text-slate-300 border-r-4 border-blue-500"></div>
                <button onclick="loadNextQuestion()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-black text-xl transition-all">
                    לסטריפ הבא >>
                </button>
            </div>
        </div>
    </div>

    <script>
        let quizData = [], history = [], currentIdx = -1, allAnswersList = [];
        let stats = { correct: 0, total: 0 };

        async function processDocx(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('loading-area').classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const result = await mammoth.convertToHtml({ arrayBuffer: e.target.result });
                await parseHTML(result.value);
            };
            reader.readAsArrayBuffer(file);
        }

        async function parseHTML(html) {
            const container = document.createElement('div');
            container.innerHTML = html;
            const elements = Array.from(container.children);
            let items = [], currentItem = null;

            for (let i = 0; i < elements.length; i++) {
                const pct = Math.round((i / elements.length) * 100);
                document.getElementById('loading-bar-fill').style.width = pct + '%';
                document.getElementById('load-pct').innerText = pct + '%';
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 1));

                const img = elements[i].querySelector('img') || (elements[i].tagName === 'IMG' ? elements[i] : null);
                if (img) {
                    if (currentItem) items.push(currentItem);
                    currentItem = { img: img.src, answer: "", details: [], options: null, userSelected: null };
                }
                const text = elements[i].textContent.trim();
                if (currentItem && text) {
                    if (text.includes("הפרעת קצב:")) currentItem.answer = text.split("הפרעת קצב:")[1].trim();
                    else if (text.length > 2 && !text.includes("הפרעת קצב")) currentItem.details.push(text);
                }
            }
            if (currentItem) items.push(currentItem);

            quizData = items.filter(i => i.img && i.answer);
            allAnswersList = [...new Set(quizData.map(i => i.answer))];

            if (quizData.length > 0) {
                document.getElementById('upload-card').classList.add('hidden');
                document.getElementById('game-card').classList.remove('hidden');
                loadNextQuestion();
            }
        }

        function loadNextQuestion() {
            // אם אנחנו חוזרים קדימה בהיסטוריה
            if (currentIdx < history.length - 1) {
                currentIdx++;
                renderQuestion(history[currentIdx]);
                return;
            }

            // בחירת שאלה חדשה
            if (quizData.length === 0) { alert("סיימת את כל המאגר!"); return; }
            const q = quizData.splice(Math.floor(Math.random() * quizData.length), 1)[0];
            
            // הגרלת אופציות
            q.options = [q.answer, ...allAnswersList.filter(a => a !== q.answer).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
            
            history.push(q);
            currentIdx = history.length - 1;
            renderQuestion(q);
        }

        function loadPreviousQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion(history[currentIdx]);
            }
        }

        function skipQuestion() {
            // מוציאים מההיסטוריה ומחזירים למאגר
            const q = history.splice(currentIdx, 1)[0];
            q.userSelected = null;
            quizData.push(q);
            
            if (history.length > 0 && currentIdx > 0) {
                currentIdx--;
                renderQuestion(history[currentIdx]);
            } else if (quizData.length > 0) {
                currentIdx = -1;
                history = [];
                loadNextQuestion();
            } else { location.reload(); }
        }

        function renderQuestion(q) {
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('ecg-container').innerHTML = `<img src="${q.img}" class="strip-img">`;
            document.getElementById('progress-text').innerText = `שאלה ${currentIdx + 1}`;
            document.getElementById('prev-btn').disabled = (currentIdx === 0);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn p-4 rounded-xl font-bold text-right';
                btn.innerText = opt;
                
                if (q.userSelected !== null) {
                    btn.disabled = true;
                    if (opt === q.answer) btn.classList.add('correct');
                    if (opt === q.userSelected && opt !== q.answer) btn.classList.add('wrong');
                    showFeedback(q);
                } else {
                    btn.onclick = () => checkResult(btn, opt, q);
                }
                grid.appendChild(btn);
            });
        }

        function checkResult(btn, selected, q) {
            q.userSelected = selected;
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            stats.total++;
            if (selected === q.answer) {
                stats.correct++;
                btn.classList.add('correct');
                confetti({ particleCount: 50, spread: 70, origin: { y: 0.8 } });
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); });
            }
            document.getElementById('score').innerText = Math.round((stats.correct / stats.total) * 100) + "%";
            showFeedback(q);
        }

        function showFeedback(q) {
            const panel = document.getElementById('feedback-panel');
            const title = document.getElementById('feedback-title');
            panel.classList.remove('hidden');
            
            if (q.userSelected === q.answer) {
                title.innerText = "נכון מאוד! 🎯";
                title.className = "text-2xl font-black mb-2 text-green-400";
            } else {
                title.innerText = "טעות... שים לב";
                title.className = "text-2xl font-black mb-2 text-red-400";
            }
            document.getElementById('clinical-info').innerHTML = `<b>${q.answer}</b><br>${q.details.join('<br>')}`;
        }
    </script>
</body>
</html>
