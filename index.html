<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור אק"ג - גרסה יציבה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; margin: 0; padding-top: 80px; font-family: sans-serif; }
        
        /* סרגל ניווט עליון קבוע - מבטיח נראות */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-prev { background-color: #475569; }
        .btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-skip { background-color: #d97706; }

        .monitor-wrap { background: #000; border: 4px solid #334155; border-radius: 1rem; overflow: hidden; margin-bottom: 20px; }
        .strip-img { width: 100%; max-height: 300px; object-fit: contain; background: white; }
        
        .option-btn { 
            background: #1e293b; 
            border: 2px solid #334155; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: right; 
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        .correct { background: #16a34a !important; border-color: #22c55e !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        
        .hidden { display: none !important; }
        #loading-bar { width: 0%; height: 100%; background: #3b82f6; transition: width 0.2s; }
    </style>
</head>
<body>

    <div id="game-header" class="sticky-header hidden">
        <div style="display: flex; gap: 10px;">
            <button id="prev-btn" class="nav-btn btn-prev" onclick="loadPreviousQuestion()">
                <i class="fas fa-arrow-right"></i> חזור
            </button>
            <button id="skip-btn" class="nav-btn btn-skip" onclick="skipQuestion()">
                דלג <i class="fas fa-forward"></i>
            </button>
        </div>
        <div id="progress-text" style="font-weight: 900; color: #60a5fa;"></div>
        <div style="font-weight: bold;">ציון: <span id="score" style="color: #4ade80;">0%</span></div>
    </div>

    <div class="max-w-4xl mx-auto p-4">
        <div id="upload-card" class="bg-slate-800 p-8 rounded-2xl text-center border border-slate-700">
            <h1 class="text-2xl font-bold mb-4">סימולטור אק"ג - העלאת קובץ</h1>
            <input type="file" id="docx-file" accept=".docx" class="hidden" onchange="processDocx(event)">
            <button onclick="document.getElementById('docx-file').click()" class="bg-blue-600 px-8 py-3 rounded-full font-bold">בחר קובץ DOCX</button>
            
            <div id="loading-area" class="hidden mt-6">
                <div class="w-full bg-gray-700 h-4 rounded-full overflow-hidden">
                    <div id="loading-bar"></div>
                </div>
                <p id="load-pct" class="mt-2">0%</p>
            </div>
        </div>

        <div id="game-card" class="hidden">
            <div class="monitor-wrap"><div id="ecg-container"></div></div>
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

            <div id="feedback-panel" class="hidden bg-slate-800 p-6 rounded-2xl border-2 border-blue-500 mt-4">
                <h2 id="feedback-title" class="text-xl font-bold mb-2"></h2>
                <div id="clinical-info" class="bg-slate-900 p-4 rounded-lg mb-4 text-sm"></div>
                <button onclick="loadNextQuestion()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg">לסטריפ הבא >></button>
            </div>
        </div>
    </div>

    <script>
        let quizData = [], history = [], currentIdx = -1, allAnswersList = [];
        let stats = { correct: 0, total: 0 };

        async function processDocx(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('loading-area').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async (e) => {
                const result = await mammoth.convertToHtml({ arrayBuffer: e.target.result });
                await parseHTML(result.value);
            };
            reader.readAsArrayBuffer(file);
        }

        async function parseHTML(html) {
            const container = document.createElement('div');
            container.innerHTML = html;
            const elements = Array.from(container.children);
            let items = [], currentItem = null;

            for (let i = 0; i < elements.length; i++) {
                const pct = Math.round((i / elements.length) * 100);
                document.getElementById('loading-bar').style.width = pct + '%';
                document.getElementById('load-pct').innerText = pct + '%';
                if (i % 20 === 0) await new Promise(r => setTimeout(r, 1));

                const img = elements[i].querySelector('img') || (elements[i].tagName === 'IMG' ? elements[i] : null);
                if (img) {
                    if (currentItem) items.push(currentItem);
                    currentItem = { img: img.src, answer: "", details: [], options: null, userSelected: null };
                }
                const text = elements[i].textContent.trim();
                if (currentItem && text) {
                    if (text.includes("הפרעת קצב:")) currentItem.answer = text.split("הפרעת קצב:")[1].trim();
                    else if (text.length > 2 && !text.includes("הפרעת קצב")) currentItem.details.push(text);
                }
            }
            if (currentItem) items.push(currentItem);
            quizData = items.filter(i => i.img && i.answer);
            allAnswersList = [...new Set(quizData.map(i => i.answer))];

            if (quizData.length > 0) {
                document.getElementById('upload-card').classList.add('hidden');
                document.getElementById('game-header').classList.remove('hidden');
                document.getElementById('game-card').classList.remove('hidden');
                loadNextQuestion();
            }
        }

        function loadNextQuestion() {
            if (currentIdx < history.length - 1) {
                currentIdx++;
                renderQuestion(history[currentIdx]);
                return;
            }
            if (quizData.length === 0) return;
            const q = quizData.splice(Math.floor(Math.random() * quizData.length), 1)[0];
            q.options = [q.answer, ...allAnswersList.filter(a => a !== q.answer).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
            history.push(q);
            currentIdx = history.length - 1;
            renderQuestion(q);
        }

        function loadPreviousQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion(history[currentIdx]);
            }
        }

        function skipQuestion() {
            const q = history.splice(currentIdx, 1)[0];
            q.userSelected = null;
            quizData.push(q);
            if (history.length > 0 && currentIdx < history.length) {
                renderQuestion(history[currentIdx]);
            } else if (history.length > 0) {
                currentIdx--;
                renderQuestion(history[currentIdx]);
            } else {
                currentIdx = -1;
                loadNextQuestion();
            }
        }

        function renderQuestion(q) {
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('ecg-container').innerHTML = `<img src="${q.img}" class="strip-img">`;
            document.getElementById('progress-text').innerText = `שאלה ${currentIdx + 1}`;
            document.getElementById('prev-btn').disabled = (currentIdx === 0);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                if (q.userSelected !== null) {
                    btn.disabled = true;
                    if (opt === q.answer) btn.classList.add('correct');
                    if (opt === q.userSelected && opt !== q.answer) btn.classList.add('wrong');
                    showFeedback(q);
                } else {
                    btn.onclick = () => checkResult(btn, opt, q);
                }
                grid.appendChild(btn);
            });
        }

        function checkResult(btn, selected, q) {
            q.userSelected = selected;
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            stats.total++;
            if (selected === q.answer) {
                stats.correct++;
                btn.classList.add('correct');
                confetti({ particleCount: 40 });
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); });
            }
            document.getElementById('score').innerText = Math.round((stats.correct / stats.total) * 100) + "%";
            showFeedback(q);
        }

        function showFeedback(q) {
            const panel = document.getElementById('feedback-panel');
            panel.classList.remove('hidden');
            document.getElementById('feedback-title').innerText = (q.userSelected === q.answer) ? "נכון!" : "טעות...";
            document.getElementById('clinical-info').innerHTML = `<b>${q.answer}</b><br>${q.details.join('<br>')}`;
        }
    </script>
</body>
</html>
