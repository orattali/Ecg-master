<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאסטר האק"ג - פענוח והפרעות קצב</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monitor: {
                            bg: '#020617',
                            grid: '#0f766e',
                            line: '#34d399',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-reverse': 'float-reverse 8s ease-in-out infinite',
                        'heartbeat': 'heartbeat 1.2s ease-in-out infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'pop-in': 'popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'bounce-fun': 'bounceFun 3s ease-in-out infinite',
                        'slide-down': 'slideDown 0.5s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' },
                        },
                        'float-reverse': {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(20px) rotate(-5deg)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '15%': { transform: 'scale(1.2)' },
                            '30%': { transform: 'scale(1)' },
                            '45%': { transform: 'scale(1.2)' },
                            '70%': { transform: 'scale(1)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        bounceFun: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(5%)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(120deg, #fcd34d 0%, #f472b6 50%, #38bdf8 100%);
            background-attachment: fixed;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .ecg-bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='100' viewBox='0 0 200 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 50 L30 50 L35 40 L40 50 L45 50 L55 20 L65 90 L75 50 L85 50 L95 65 L105 50 L200 50' stroke='%23ffffff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-size: 300px 150px;
            pointer-events: none;
        }

        .bg-pattern i { position: absolute; }
        
        .glass-panel {
            background: rgba(254, 243, 199, 0.85);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(251, 146, 60, 0.6);
            box-shadow: 0 25px 50px rgba(153, 27, 27, 0.25);
        }

        .monitor-screen {
            background-color: #020617;
            background-image: 
                linear-gradient(rgba(15, 118, 110, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 118, 110, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 10px 20px rgba(0,0,0,0.3);
            border: 6px solid #334155;
            border-bottom: 12px solid #1e293b;
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
        }
        
        .monitor-screen::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(52, 211, 153, 0.1), transparent);
            transform: skewX(-20deg);
            animation: scanline 4s infinite linear;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .strip-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border: 2px solid #34d399;
            border-radius: 0.5rem;
            background-color: #fefce8;
            padding: 0.5rem;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #fcd34d; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 6px; border: 2px solid #fcd34d;}
        ::-webkit-scrollbar-thumb:hover { background: #be185d; }
    </style>
</head>
<body class="flex flex-col items-center p-4 relative pt-24 md:pt-32">

    <div class="ecg-bg-pattern"></div>

    <div class="bg-pattern opacity-40 text-pink-700" aria-hidden="true">
        <i class="fas fa-heartbeat animate-float" style="top: 15%; left: 10%; font-size: 5rem;"></i>
        <i class="fas fa-stethoscope animate-float-reverse" style="top: 60%; left: 85%; font-size: 7rem;"></i>
        <i class="fas fa-pills animate-float" style="top: 80%; left: 15%; font-size: 4rem;"></i>
    </div>

    <div id="top-bar" class="hidden fixed top-0 left-0 w-full z-[60] bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-600 shadow-xl border-b-4 border-fuchsia-300 py-3 px-4 flex justify-between items-center">
        <div class="flex items-center text-white font-black text-base md:text-2xl flex-1">
            <span class="whitespace-nowrap">ציון: <span id="score-display" class="text-xl md:text-3xl text-green-300">100%</span></span>
        </div>
        <div class="flex items-center justify-center flex-1">
            <div class="bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 text-white font-black px-3 py-1 md:px-6 md:py-2 rounded-full shadow-lg border-2 border-yellow-200 animate-bounce-fun">
                <span class="text-lg md:text-3xl tracking-wider">קפ"ע 16</span>
            </div>
        </div>
        <div class="flex justify-end flex-1">
            <button onclick="location.reload()" class="bg-red-500 text-white px-3 py-2 rounded-full text-xs md:text-lg font-black border-2 border-rose-300">
                <i class="fas fa-undo-alt"></i> ריסט
            </button>
        </div>
    </div>

    <div id="app-container" class="glass-panel rounded-3xl w-full max-w-4xl relative z-10 flex flex-col items-center mb-24 border-4 border-orange-400">
        <div class="bg-gradient-to-r from-rose-500 via-purple-500 to-indigo-500 text-white w-full text-center py-6 md:py-10 relative shadow-lg rounded-t-[1.3rem]">
            <h1 class="text-4xl md:text-6xl font-black drop-shadow-lg px-2">מאסטר האק"ג</h1>
        </div>

        <div class="p-6 md:p-10 w-full flex flex-col items-center mt-6">
            <div id="loading-screen" class="w-full hidden flex-col items-center justify-center py-16 space-y-6 text-indigo-900">
                <i class="fas fa-cog fa-spin text-8xl text-indigo-600"></i>
                <h2 class="text-4xl font-black">מנתח את המאגר...</h2>
            </div>

            <div id="start-screen" class="w-full flex flex-col items-center text-center animate-pop-in">
                <div class="w-full bg-gradient-to-br from-cyan-200 to-blue-300 border-4 border-blue-500 p-8 rounded-3xl shadow-2xl max-w-2xl mx-auto">
                    <h3 class="text-3xl font-black text-blue-900 mb-6">העלאת תרגול אק"ג</h3>
                    <input type="file" id="docx-upload" accept=".docx" class="hidden" onchange="handleFileUpload(event)">
                    <button onclick="document.getElementById('docx-upload').click();" class="px-8 py-5 bg-blue-600 text-white font-black text-2xl rounded-full shadow-xl hover:bg-blue-700 transition-all">
                        העלה קובץ וורד!
                    </button>
                </div>
            </div>

            <div id="game-screen" class="w-full hidden flex-col items-center">
                <div class="w-full bg-orange-100 rounded-t-3xl border-4 border-b-0 border-orange-400 px-6 py-4 flex justify-between items-center">
                    <div class="text-orange-950 font-black text-xl">
                        זמן: <span id="timer-text" class="text-red-600 bg-white px-3 py-1 rounded-lg">60</span>
                    </div>
                </div>
                <div class="w-full h-5 bg-orange-200 rounded-b-3xl mb-10 overflow-hidden border-4 border-t-0 border-orange-400">
                    <div id="timer-bar" class="h-full bg-gradient-to-l from-rose-500 to-purple-500 w-full transition-all duration-1000"></div>
                </div>

                <div class="w-full monitor-screen p-4 md:p-8 shadow-2xl relative">
                    <div class="flex justify-between items-center border-b-4 border-slate-700 pb-4 mb-6">
                        <h2 class="text-xl md:text-3xl font-black text-emerald-400 font-mono">Q_ID: <span id="q-id-display" class="text-white">000</span></h2>
                        <button id="btn-back" onclick="goBack()" class="hidden bg-slate-800 text-cyan-300 px-4 py-2 rounded-xl border-2 border-cyan-800">חזור</button>
                    </div>
                    
                    <div id="question-display" class="w-full min-h-[150px] flex flex-col items-center justify-center mb-8"></div>

                    <div class="w-full flex justify-center" id="reveal-btn-container">
                        <button id="btn-show-answer" onclick="revealAnswer()" class="bg-emerald-500 text-slate-900 font-black text-2xl py-4 px-12 rounded-full border-4 border-emerald-200">חשוף פענוח!</button>
                    </div>
                    
                    <div id="answer-details" class="hidden flex-col w-full animate-slide-down mt-6 border-t-4 border-slate-700 pt-8">
                        <div class="bg-slate-900 p-6 rounded-3xl border-2 border-cyan-800 text-center">
                            <h3 id="answer-text" class="text-3xl md:text-5xl font-black text-emerald-300" dir="ltr"></h3>
                            <div id="answer-clinical-data" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 text-right"></div>
                        </div>
                    </div>
                </div>

                <div id="assessment-section" class="hidden w-full mt-8 animate-pop-in">
                    <div class="w-full bg-yellow-300 p-6 rounded-3xl border-4 border-orange-500 text-center">
                        <h4 class="text-2xl font-black mb-6">ידעת את זה?</h4>
                        <div class="flex gap-6">
                            <button onclick="handleAnswer(true)" class="flex-1 bg-green-500 text-white font-black py-4 rounded-2xl border-4 border-green-200">ברור!</button>
                            <button onclick="handleAnswer(false)" class="flex-1 bg-rose-500 text-white font-black py-4 rounded-2xl border-4 border-red-200">טעיתי</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="feedback-overlay" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 bg-black bg-opacity-40 hidden">
        <div id="feedback-icon" class="text-[10rem] md:text-[15rem] transition-transform duration-500"></div>
    </div>

    <footer class="fixed bottom-0 w-full bg-blue-900 text-cyan-100 py-3 text-center border-t-4 border-cyan-400 z-40 font-black">
        נוצר ע"י מני קורן, קפ"ע 16. <i class="fas fa-bolt text-yellow-300"></i>
    </footer>

    <script>
        // אודיו
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur, start, vol = 0.5) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + start + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + start); osc.stop(audioCtx.currentTime + start + dur);
        }
        function playSuccessSound() { playTone(523, 'sine', 0.1, 0); playTone(1046, 'sine', 0.6, 0.3); }
        function playFailSound() { playTone(300, 'sawtooth', 0.3, 0); playTone(200, 'sawtooth', 0.6, 0.4); }
        function playTickSound() { playTone(1200, 'square', 0.05, 0, 0.05); }
        function playClickSound() { playTone(400, 'sine', 0.1, 0, 0.2); }

        // אלמנטים
        const elStartScreen = document.getElementById('start-screen'), elLoadingScreen = document.getElementById('loading-screen'),
              elGameScreen = document.getElementById('game-screen'), elTopBar = document.getElementById('top-bar'),
              elQuestionDisplay = document.getElementById('question-display'), elBtnShowAnswer = document.getElementById('btn-show-answer'),
              elRevealBtnContainer = document.getElementById('reveal-btn-container'), elAnswerDetails = document.getElementById('answer-details'),
              elAnswerText = document.getElementById('answer-text'), elAnswerClinicalData = document.getElementById('answer-clinical-data'),
              elBtnBack = document.getElementById('btn-back'), elAssessmentSection = document.getElementById('assessment-section'),
              elScoreDisplay = document.getElementById('score-display'), elQIdDisplay = document.getElementById('q-id-display'),
              elTimerText = document.getElementById('timer-text'), elTimerBar = document.getElementById('timer-bar'),
              elFeedbackOverlay = document.getElementById('feedback-overlay'), elFeedbackIcon = document.getElementById('feedback-icon');

        // משתני מצב
        let fullDatabase = [];
        let completedQuestions = []; // רשימת מזהים שכבר בוצעו
        let historyStack = []; 
        let currentQuestion = null;
        let questionCounter = 0;
        let stats = { totalAnswered: 0, known: 0 };
        let timerInterval = null, timeLeft = 60, TIME_LIMIT = 60;

        function shuffle(array) {
            let cur = array.length, rand;
            while (cur != 0) { rand = Math.floor(Math.random() * cur); cur--; [array[cur], array[rand]] = [array[rand], array[cur]]; }
            return array;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            playClickSound();
            elStartScreen.classList.add('hidden'); elLoadingScreen.classList.remove('hidden'); elLoadingScreen.classList.add('flex');
            const reader = new FileReader();
            reader.onload = function(e) {
                mammoth.convertToHtml({arrayBuffer: e.target.result})
                    .then(res => processParsedHTML(res.value))
                    .catch(err => { alert("שגיאה בקובץ"); location.reload(); });
            };
            reader.readAsArrayBuffer(file);
        }

        function processParsedHTML(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            fullDatabase = [];
            let currentItem = { imageSrc: null, details: [], answer: "", rawLines: [], id: 0 };
            
            function pushItem() {
                if (currentItem.imageSrc || currentItem.answer) {
                    currentItem.id = fullDatabase.length + 1;
                    fullDatabase.push({...currentItem});
                }
                currentItem = { imageSrc: null, details: [], answer: "", rawLines: [], id: 0 };
            }

            Array.from(doc.body.children).forEach(el => {
                const img = el.querySelector('img') || (el.tagName === 'IMG' ? el : null);
                if (img) { pushItem(); currentItem.imageSrc = img.src; }
                let text = el.textContent.trim();
                if (text) {
                    text.split(/\n+/).forEach(line => {
                        line = line.trim();
                        if (line.includes("הפרעת קצב:")) {
                            currentItem.answer = line.split("הפרעת קצב:")[1].replace(/^:\s*/, '').trim();
                        } else if (/^\s*(קצב|מ[י]?קצב|גל[י]?\s*P|מרווח\s*P-?R|קומפלקס\s*QRS|QRS)\s*:/i.test(line)) {
                            currentItem.details.push(line);
                        } else if (!line.startsWith('אק"ג') && !line.startsWith('שאלה')) {
                            currentItem.rawLines.push(line);
                        }
                    });
                }
            });
            pushItem();

            fullDatabase.forEach(item => {
                if (!item.answer && item.rawLines.length > 0) item.answer = item.rawLines.find(l => l.length > 4) || "לא צוין";
                if (!item.answer) item.answer = "לא צוין";
            });

            if (fullDatabase.length === 0) { alert("לא נמצאו שאלות"); return; }
            completedQuestions = []; stats = { totalAnswered: 0, known: 0 };
            elLoadingScreen.classList.add('hidden'); elTopBar.classList.remove('hidden'); elGameScreen.classList.remove('hidden');
            prepareNextQuestion();
        }

        function prepareNextQuestion() {
            // סינון רק של מה שלא עשינו
            const available = fullDatabase.filter(q => !completedQuestions.includes(q.id));
            
            if (available.length === 0) {
                if(confirm("סיימת את כל הסטריפים! להתחיל מחדש?")) {
                    completedQuestions = [];
                    prepareNextQuestion();
                }
                return;
            }

            // הגרלה מתוך הזמינים
            const shuffledAvailable = shuffle([...available]);
            currentQuestion = shuffledAvailable.pop();
            completedQuestions.push(currentQuestion.id);
            questionCounter++;
            renderQuestion();
        }

        function renderQuestion() {
            elBtnBack.classList.toggle('hidden', historyStack.length === 0);
            elQIdDisplay.innerText = String(currentQuestion.id).padStart(3, '0');
            elQuestionDisplay.innerHTML = currentQuestion.imageSrc ? `<img src="${currentQuestion.imageSrc}" class="strip-image">` : `<p class="text-white">אין תמונה</p>`;
            
            elAnswerClinicalData.innerHTML = '';
            currentQuestion.details.forEach(d => {
                const div = document.createElement('div');
                div.className = 'bg-slate-800 p-3 rounded-xl border border-slate-600 text-emerald-200';
                div.innerText = d;
                elAnswerClinicalData.appendChild(div);
            });

            elAnswerDetails.classList.add('hidden'); elAssessmentSection.classList.add('hidden'); elRevealBtnContainer.classList.remove('hidden');
            startTimer();
        }

        function goBack() {
            if (historyStack.length === 0) return;
            // הסרה מרשימת הבוצעו כדי שיוכל להופיע שוב בהמשך
            completedQuestions = completedQuestions.filter(id => id !== currentQuestion.id);
            const prev = historyStack.pop();
            currentQuestion = prev.question;
            stats.totalAnswered--; if (prev.knewIt) stats.known--;
            questionCounter--;
            updateScore(); renderQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval); timeLeft = TIME_LIMIT; updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerUI();
                if (timeLeft <= 5 && timeLeft > 0) playTickSound();
                if (timeLeft <= 0) { clearInterval(timerInterval); revealAnswer(); }
            }, 1000);
        }

        function updateTimerUI() {
            elTimerText.innerText = timeLeft; elTimerBar.style.width = `${(timeLeft / TIME_LIMIT) * 100}%`;
        }

        function revealAnswer() {
            clearInterval(timerInterval); elRevealBtnContainer.classList.add('hidden');
            elAnswerText.innerText = currentQuestion.answer;
            elAnswerDetails.classList.remove('hidden'); elAnswerDetails.classList.add('flex');
            elAssessmentSection.classList.remove('hidden');
        }

        function handleAnswer(knewIt) {
            stats.totalAnswered++; if (knewIt) { stats.known++; playSuccessSound(); showFeedback(true); confetti({particleCount:100}); } else { playFailSound(); showFeedback(false); }
            historyStack.push({ question: currentQuestion, knewIt: knewIt });
            updateScore();
            setTimeout(prepareNextQuestion, 1500);
        }

        function updateScore() {
            const pct = stats.totalAnswered === 0 ? 100 : Math.round((stats.known / stats.totalAnswered) * 100);
            elScoreDisplay.innerText = `${pct}%`;
        }

        function showFeedback(pos) {
            elFeedbackOverlay.classList.remove('hidden', 'opacity-0');
            elFeedbackIcon.innerHTML = pos ? '<i class="fas fa-smile-beam text-green-400"></i>' : '<i class="fas fa-frown-open text-rose-500"></i>';
            setTimeout(() => { elFeedbackOverlay.classList.add('opacity-0'); setTimeout(() => elFeedbackOverlay.classList.add('hidden'), 300); }, 1000);
        }
    </script>
</body>
</html>
