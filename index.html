<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאסטר האק"ג - גרסת המוניטור</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <script>
        // מאגר השאלות המקורי שלך (השאר אותו כפי שהוא)
        const allQuestions = [
            { id: 1, type: 'Normal Sinus', image: 'path/to/img1.jpg', options: ['Sinus', 'VT', 'VF'] },
            // ... כל השאלות שלך
        ];

        // משתני עזר לניהול הסבב הנוכחי
        let shuffledQuestions = [];
        let currentQuestionIndex = 0;

        /**
         * פונקציית ערבוב בשיטת Fisher-Yates
         * מבטיחה סדר אקראי לחלוטין של המערך
         */
        function shuffleArray(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        /**
         * אתחול המבחן/תרגול
         */
        function initQuiz() {
            // יצירת עותק מעורבב של השאלות
            shuffledQuestions = shuffleArray(allQuestions);
            currentQuestionIndex = 0;
            loadNextQuestion();
        }

        /**
         * טעינת השאלה הבאה מהתור המעורבב
         */
        function loadNextQuestion() {
            // בדיקה אם נותרו שאלות במאגר המעורבב
            if (currentQuestionIndex < shuffledQuestions.length) {
                const currentQuestion = shuffledQuestions[currentQuestionIndex];
                
                // כאן תכניס את הלוגיקה הקיימת שלך להצגת השאלה
                displayQuestion(currentQuestion);
                
                // קידום האינדקס לשאלה הבאה
                currentQuestionIndex++;
            } else {
                // סיום המאגר
                alert("כל הכבוד! עברת על כל השאלות במאגר.");
                if (confirm("האם תרצה להתחיל סבב חדש (בסדר אקראי שונה)?")) {
                    initQuiz();
                }
            }
        }

        function displayQuestion(question) {
            // הפונקציה הקיימת שלך שמעדכנת את ה-UI (תמונה, כפתורים וכו')
            console.log("מציג שאלה:", question.id);
            // למשל: document.getElementById('ecg-image').src = question.image;
        }

        // הפעלה ראשונית
        window.onload = initQuiz;

    </script>
</body>
</html>
